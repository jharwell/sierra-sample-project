inter-exp:
  LN_default:
    - src: output1D
      dest: random-noise-col1
      cols:
        - col1
      title: 'Random noise col1'
      xlabel: 'Time'
      type: 'stacked_line'

  HG_default:
    - src: output1D
      dest: random-noise-col1
      cols:
        - col1
      title: 'Random noise col1'
      xlabel: 'Time'
      type: 'histogram'

  HM_bivar:
    - src: output1D
      dest: bivar-random-noise-col1
      z: col1
      title: 'Random noise col1'
      xlabel: 'Time'
      type: 'heatmap'

intra-exp:
  LN_default:
    - src: output1D
      dest: random-noise
      cols:
        - col1
        - col2
      title: 'Random noise'
      legend:
        - 'One column'
        - 'Two column'

      xlabel: 'Time'
      ylabel: 'Fizziness'
      logy: true
      type: 'stacked_line'

  CM_default:
    - src: confusion-matrix
      dest: confusion-matrix
      type: "confusion_matrix"
      title: "I'm A Little Confused"
      truth_col: Actual_Class
      predicted_col: Predicted_Class
      xlabels_rotate: true

  HG_default:
    - src: output1D
      dest: random-noise
      cols:
        - col1
      title: 'Random noise col1'
      xlabel: 'Time'
      type: 'histogram'

imagize:
  - src: output/erdos_renyi
    type: "network"
    title: "Example graph"
