# yamlsim graph configuration.
#
# Category suffixes select WHEN a category renders:
#   *_default -> univariate batch criteria ; *_bivar -> bivariate.
# Output files are type-prefixed by the generators:
#   SLN- stacked_line  SM- summary_line  HM- heatmap  HG- histogram
#   CM- confusion      NW- network (via imagize)

inter-exp:
  # Summary line: one datapoint per experiment.
  LN_default:
    - src: signal-trace
      dest: signal-summary
      cols:
        - measured
      title: 'Signal summary across batch'
      xlabel: 'Time'
      type: 'stacked_line'

  # Histograms of the collated inter-exp signal, in all three render kinds.
  HG_default:
    - src: signal-trace
      dest: signal-hist-overlay
      cols:
        - measured
      title: 'Measured signal distribution'
      xlabel: 'Amplitude'
      type: 'histogram'

    - src: signal-trace
      dest: signal-hist-steps
      cols:
        - measured
      title: 'Measured signal distribution'
      xlabel: 'Amplitude'
      type: 'histogram'
      kind: steps

    - src: signal-trace
      dest: signal-hist-facet
      cols:
        - measured
      title: 'Measured signal distribution'
      xlabel: 'Amplitude'
      type: 'histogram'
      kind: facet

  # Bivariate surface: heatmap over the 2D criteria grid.
  HM_bivar:
    - src: signal-trace
      dest: signal-surface
      z: measured
      title: 'Signal surface (2D criteria)'
      xlabel: 'Criterion 1'
      type: 'heatmap'

intra-exp:
  # Time-series line graph: reference vs measured, with spread bands.
  LN_default:
    - src: signal-trace
      dest: signal-intra
      cols:
        - reference
        - measured
      title: 'Signal: reference vs measured'
      legend:
        - 'Reference (ideal)'
        - 'Measured (noisy)'
      xlabel: 'Time'
      ylabel: 'Amplitude'
      logy: true
      type: 'stacked_line'

  # Confusion matrix (categorical showcase).
  CM_default:
    - src: classification
      dest: classification
      type: "confusion_matrix"
      title: "Classification confusion matrix"
      truth_col: Actual_Class
      predicted_col: Predicted_Class
      xlabels_rotate: true

  # Histograms of the measured channel, in all three kinds.
  HG_default:
    - src: signal-trace
      dest: signal-hist-overlay
      cols:
        - measured
      title: 'Measured signal distribution'
      xlabel: 'Amplitude'
      type: 'histogram'
      kind: overlay

    - src: signal-trace
      dest: signal-hist-steps
      cols:
        - measured
      title: 'Measured signal distribution'
      xlabel: 'Amplitude'
      type: 'histogram'
      kind: steps

    - src: signal-trace
      dest: signal-hist-facet
      cols:
        - measured
      title: 'Measured signal distribution'
      xlabel: 'Amplitude'
      type: 'histogram'
      kind: facet

# Imagize: plot a directory of graphml files as network diagrams.
imagize:
  - src: output/networks
    type: "network"
    title: "Scale-free topology"
