# Model configuration. Models generate predicted curves that get overlaid on the
# corresponding line graphs (intra: stacked_line; inter: summary_line). The
# 'targets' name the graph outputs a model attaches to; the plugin names
# (noise.*) are code references, unchanged.

intra-exp:
  - name: noise.NoisyModel
    targets:
      - signal-trace
    legend:
      - A very noisy model

inter-exp:
  - name: noise.LessNoisyModel
    targets:
      - signal-summary
    legend:
      - A less noisy model
