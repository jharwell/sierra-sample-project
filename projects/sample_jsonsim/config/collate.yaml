# collate.yaml is a flat list of collation targets. Collation is
# intra-experiment only (it lifts per-run raw data within an experiment, e.g. so
# models can compute from the raw distribution rather than the summary
# statistics), so there is no section wrapper.

# Single-source spelling (the common case): collate specific columns from one
# output file. 'signal-trace.csv' is rooted at the run output root.
- file: 'signal-trace.csv'
  cols:
    - 'measured'
    - 'drift'

# A nested single source, named by its path relative to the output root.
- file: 'sensors/primary/signal-trace.csv'
  cols:
    - 'measured'

# Multi-source spelling: assemble one collated target from columns pulled from
# different files. 'measured' comes from the root signal-trace.csv; 'measured'
# from sensors/backup/signal-trace.csv would collide, so it is renamed via 'as'.
# Both files share a row axis, so the per-run horizontal join is well-defined.
- name: 'sensor-combined'
  sources:
    - file: 'signal-trace.csv'
      cols:
        - 'measured'
    - file: 'sensors/backup/signal-trace.csv'
      cols:
        - name: 'measured'
          as: 'measured_backup'
