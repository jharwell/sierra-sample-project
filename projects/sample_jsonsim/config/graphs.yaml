inter-exp:
  LN_default:
    - src: output1D
      dest: random-noise-col1
      cols:
        - col1
      title: 'Random noise col1'
      xlabel: 'Time'
      type: 'stacked_line'

    - src: subdir1/subdir2/output1D
      dest: random-noise2-col2
      cols:
        - col2
      title: 'Random noise col2'
      xlabel: 'Time'
      type: 'stacked_line'

    - src: subdir3/output1D
      dest: random-noise3-col2
      col: col2
      title: 'Random noise col2'
      xlabel: 'Time'
      ylabel: "Noisiness"
      type: 'summary_line'

  HM_bivar:
    - src: output1D
      dest: bivar-random-noise-col1
      title: 'Random noise col1'
      xlabel: 'Time'
      type: 'heatmap'

    - src: subdir1/subdir2/output1D
      dest: bivar-random-noise2-col2
      title: 'Random noise col2'
      xlabel: 'Time'
      type: 'heatmap'

    - src: subdir3/output1D
      dest: bivar-random-noise3-col2
      title: 'Random noise col2'
      xlabel: 'Time'
      ylabel: "Noisiness"
      type: 'heatmap'

  SP_default:
    - src: subdir3/output1D
      dest: random-noise
      xcol: col1
      ycol: col2
      title: 'Noise vs. noise'
      type: 'scatterplot'
      show_best_fit: true
      best_fit_kind: linear

intra-exp:
  LN_default:
    - src: output1D
      dest: random-noise
      cols:
        - col1
        - col2
      title: 'Random noise'
      legend:
        - 'One column'
        - 'Two column'

      xlabel: 'Time'
      ylabel: 'Fizziness'
      logy: true
      type: 'stacked_line'

    - src: subdir1/subdir2/output1D
      dest: random-noise2
      title: 'Random noise'
      xlabel: 'Time'
      ylabel: 'Fizziness'
      type: 'stacked_line'

    - src: subdir3/output1D
      dest: random-noise3
      cols:
        - col1
        - col2
      title: 'Random noise'
      legend:
        - 'One column'
        - 'Two column'

      xlabel: 'Time'
      ylabel: 'Fizziness'
      type: 'stacked_line'

    - dest: combined-noise
      sources:
        - file: subdir3/output1D
          cols:
            - name: col1
              as: nested-col1
        - file: subdir1/subdir2/output1D
          cols:
            - name: col1
              as: deep-nested-col1
      title: 'Combined noise'
      legend:
        - 'One column'
        - 'Two column'

      xlabel: 'Time'
      ylabel: 'Fizziness'
      type: 'stacked_line'

  HM_default:
    - src: output2D
      dest: output2D-1
      title: '2D Fizziness'
      xlabel: 'bubbles'
      ylabel: 'liquid'
      zlabel: 'carbonation'
      type: 'heatmap'

    - src: subdir3/output2D
      dest: output2D-2
      title: '2D Fizziness'
      type: 'heatmap'

  SP_default:
    - src: subdir3/output1D
      dest: noise-vs-noise
      xcol: col1
      ycol: col2
      title: 'Noise vs. noise'
      type: 'scatterplot'

    - src: subdir3/output1D
      dest: noise-vs-noise-fit
      xcol: col1
      ycol: col2
      title: 'Noise vs. noise (with fit)'
      type: 'scatterplot'
      show_best_fit: true
      best_fit_kind: linear
